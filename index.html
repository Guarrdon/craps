<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Craps in your browser. A Vegas layout with every bet on it, real table limits, and dice that are actually thrown."
    />
    <!-- Inline, so the page makes no network request of its own. -->

    />
    <title>Craps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- The way back to the portal, and the service worker that keeps this
         game on the device. Both are served from the portal's own origin with
         an absolute path, so they simply do not load on a dev server - which
         is what we want: no exit chip when there is nothing to exit to. -->
    <script src="/shared/exit-to-portal.js" defer></script>
    <script src="/shared/offline.js" defer></script>
  </body>
</html>
